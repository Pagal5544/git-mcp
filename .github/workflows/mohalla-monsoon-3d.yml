name: Mohalla Monsoon 3D Android APK

on:
  push:
    branches:
      - "**"
    paths:
      - "games/mohalla-monsoon-3d/**"
      - ".github/workflows/mohalla-monsoon-3d.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-game:
    name: Build native C++ game APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python asset generator
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install procedural texture generator dependencies
        run: python -m pip install --upgrade pip numpy pillow

      - name: Locate Android SDK on the hosted runner
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK directory not found at $SDK_ROOT"
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "Using SDK: $SDK_ROOT"
          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Accept SDK licences and install native build packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Generate realistic surface texture pack
        working-directory: games/mohalla-monsoon-3d
        run: |
          python tools/generate_assets.py
          python - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/assets/textures")
          files = sorted(p.glob("*.rgbtex"))
          total = sum(f.stat().st_size for f in files)
          print(f"Texture files: {len(files)}; payload: {total:,} bytes")
          assert len(files) == 7, f"Expected 7 texture maps, found {len(files)}"
          assert total > 50_000_000, f"Texture pack unexpectedly small: {total}"
          PY

      - name: Set up Gradle 8.7
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.7"

      - name: Stage the licensed rigged GLB character
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/characters
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/03251428e295f20d8c4a65ddbbd7dafe4f251c6d/Models/CesiumMan/glTF-Binary/CesiumMan.glb" \
            -o app/src/main/assets/characters/player.glb
          size="$(stat -c '%s' app/src/main/assets/characters/player.glb)"
          echo "Rigged character GLB size: ${size} bytes"
          test "$size" -gt 20000
          cat > app/src/main/assets/characters/ATTRIBUTION.txt <<'EOF'
          Cesium Man textured animated character sample
          Copyright: Cesium / Khronos Group contributors
          Source: https://github.com/KhronosGroup/glTF-Sample-Assets/tree/main/Models/CesiumMan
          License: Creative Commons Attribution 4.0 International (CC BY 4.0)
          https://creativecommons.org/licenses/by/4.0/
          The sample is staged by CI to exercise skinned animation and embedded base-colour texture rendering. It includes a Cesium logo/trademark on the authored model and is an interim character asset, not a custom South Asian rain-jacket photorealistic player.
          EOF

      - name: Compile native game and package APK
        id: compile
        working-directory: games/mohalla-monsoon-3d
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee "$RUNNER_TEMP/mohalla-gradle-build.log"
          result=${PIPESTATUS[0]}
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit "$result"

      - name: Preserve compile failure diagnostics on this feature branch
        if: failure() && steps.compile.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build-diagnostics
          cp "$RUNNER_TEMP/mohalla-gradle-build.log" build-diagnostics/latest-gradle-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          git switch -C "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
          git add build-diagnostics/latest-gradle-failure.log
          git commit -m "Record native game build failure diagnostics [skip ci]"
          git push origin "$GITHUB_REF_NAME"

      - name: Upload build log for troubleshooting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mohalla-monsoon-build-log
          path: ${{ runner.temp }}/mohalla-gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify APK distribution size
        id: apk
        run: |
          APK="games/mohalla-monsoon-3d/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          SIZE="$(stat -c%s "$APK")"
          echo "APK bytes: $SIZE"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          if [ "$SIZE" -le 50000000 ]; then
            echo "The APK is smaller than the requested 50 MB distribution target."
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mohalla-monsoon-debug-apk
          path: games/mohalla-monsoon-3d/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          echo "## Mohalla Monsoon Mission" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: `$GITHUB_REF_NAME`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Native engine: C++17 + OpenGL ES 2.0" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK byte target: greater than 50,000,000" >> "$GITHUB_STEP_SUMMARY"
          if [ -f games/mohalla-monsoon-3d/app/build/outputs/apk/debug/app-debug.apk ]; then
            stat -c '- APK size: %s bytes' games/mohalla-monsoon-3d/app/build/outputs/apk/debug/app-debug.apk >> "$GITHUB_STEP_SUMMARY"
          fi