name: Loop Browser Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/loop-browser-android"
    paths:
      - "apps/loop-browser/**"
      - ".github/workflows/loop-browser-build.yml"

permissions:
  contents: read

concurrency:
  group: loop-browser-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Loop Browser debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: true

      - name: Build debug APK
        working-directory: apps/loop-browser
        run: gradle --no-daemon assembleDebug

      - name: Upload Loop Browser APK
        uses: actions/upload-artifact@v4
        with:
          name: loop-browser-debug-apk
          path: apps/loop-browser/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
