plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mohalla.monsoon'
    compileSdk 35
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.mohalla.monsoon'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O2 -Wall -Wextra'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    androidResources {
        noCompress += ['rgbtex']
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
